name: Build and Deploy Spring Boot to AWS EC2

on:
  push:
    branches: ["main"]

# --------------------------추가
env:
  PROJECT_NAME: com_std1_api
  BUCKET_NAME: com-std1-api-bucket
  CODE_DEPLOY_APP_NAME: com_std1_api
  DEPLOYMENT_GROUP_NAME: com_std1_api_instance
# --------------------------추가

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Set up environment variables
        run: |
          touch ./.env
          chmod +x ./.env
          echo "DB_HOST: ${{ secrets.DB_HOST }}" >> ./.env       
          echo "DB_PORT: ${{ secrets.DB_PORT }}" >> ./.env       
          echo "DB_NAME: ${{ secrets.DB_NAME }}" >> ./.env       
          echo "DB_USER: ${{ secrets.DB_USER }}" >> ./.env       
          echo "DB_PW: ${{ secrets.DB_PW }}" >> ./.env

      - name: Create environment variable file
        run: |
          touch ./src/main/resources/env.yml
          chmod +x ./src/main/resources/env.yml
          echo "cloud.aws.credentials.accessKey : ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ./src/main/resources/env.yml
          echo "cloud.aws.credentials.secretKey : ${{ secrets.AWS_PRIVATE_ACCESS_KEY }}" >> ./src/main/resources/env.yml
          echo "cloud.aws.region.static : ${{ secrets.AWS_REGION_STATIC }}" >> ./src/main/resources/env.yml    
          echo "cloud.aws.stack.auto : ${{ secrets.AWS_STACK_AUTO }}" >> ./src/main/resources/env.yml

      - name: Permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      - name: Build and Test
        run: ./gradlew build test

      - name: Permission for appspec.yml
        run: chmod +x ./appspec.yml
        shell: bash

      - name: Permission for deploy.sh
        run: chmod +x ./scripts/deploy.sh
        shell: bash

      - name: Make Zip File
        run: zip -qq -r ./$GITHUB_SHA.zip .
        shell: bash

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PRIVATE_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Delete S3
        run: aws s3 rm s3://$BUCKET_NAME/$PROJECT_NAME --recursive

      - name: Upload to S3
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.zip s3://$BUCKET_NAME/$PROJECT_NAME/$GITHUB_SHA.zip

      - name: Code Deploy To EC2 instance
        run: aws deploy create-deployment
          --application-name $CODE_DEPLOY_APP_NAME
          --deployment-config-name CodeDeployDefault.HalfAtATime
          --deployment-group-name $DEPLOYMENT_GROUP_NAME
          --s3-location bucket=$BUCKET_NAME,bundleType=zip,key=$PROJECT_NAME/$GITHUB_SHA.zip
